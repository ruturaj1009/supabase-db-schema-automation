name: Deploy Phase 1 SQL Files

on:
  push:
    branches:
    - master
    paths:
    - 'supabase/phase_1/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # ── Checksum snapshot before deployment ────────────────────────────
    - name: Generate phase_1 checksums
      run: |
        echo "=== Phase 1 SQL File Checksums ===" | tee phase_1_checksums.txt
        echo "Commit SHA  : ${{ github.sha }}"    | tee -a phase_1_checksums.txt
        echo "Branch      : ${{ github.ref_name }}" | tee -a phase_1_checksums.txt
        echo "Actor       : ${{ github.actor }}"  | tee -a phase_1_checksums.txt
        echo "Timestamp   : $(date -u)"            | tee -a phase_1_checksums.txt
        echo ""                                    | tee -a phase_1_checksums.txt
        echo "SHA256  FILE"                        | tee -a phase_1_checksums.txt
        echo "----------------------------------------------" | tee -a phase_1_checksums.txt
        find supabase/phase_1 -name "*.sql" | sort | while read f; do
          sha256sum "$f" | tee -a phase_1_checksums.txt
        done

    - name: Upload checksum artifact
      uses: actions/upload-artifact@v4
      with:
        name: phase_1-checksums-${{ github.sha }}
        path: phase_1_checksums.txt
        retention-days: 90

    # ── Supabase deployment via psql ────────────────────────────────────
    # Use the CONNECTION POOLER URL from Supabase → Settings → Database
    # → Connection Pooler → Session mode (port 6543) — NOT the direct URL.
    # Direct URL (port 5432) uses IPv6 which GitHub Actions runners block.
    - name: Install PostgreSQL client
      run: sudo apt-get install -y postgresql-client

    - name: Run phase_1 SQL deployment
      id: db_push
      run: |
        echo "Applying phase_1 SQL files in sequence..."
        find supabase/phase_1 -name "*.sql" | sort | while read f; do
          echo "  --> Applying: $f"
          psql "${{ secrets.SUPABASE_DB_URL }}" -f "$f" -v ON_ERROR_STOP=1
          echo "  --> Done: $f"
        done
        echo "All phase_1 files applied successfully."
      env:
        PGSSLMODE: require
        PGCONNECT_TIMEOUT: 30

    # ── Registry update ─────────────────────────────────────────────────
    - name: Update phase_1 registry
      if: always()
      run: |
        REGISTRY="supabase/phase_1_registry.yml"
        PHASE_DIR="supabase/phase_1"
        DEPLOYED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        STATUS="applied"
        if [ "${{ steps.db_push.outcome }}" != "success" ]; then
          STATUS="failed"
        fi

        echo "=== Updating phase_1 registry ==="

        for filepath in $(find "$PHASE_DIR" -name "*.sql" | sort); do
          filename=$(basename "$filepath")

          # Skip if already registered
          if grep -q "name: \"${filename}\"" "$REGISTRY" 2>/dev/null; then
            echo "  [skip] $filename — already registered"
            continue
          fi

          # Sequence number
          existing=0
          existing=$(grep -c '^\s*- sequence:' "$REGISTRY" 2>/dev/null) || existing=0
          seq=$((existing + 1))

          # Checksum
          checksum=$(sha256sum "$filepath" | awk '{print $1}')

          echo "  [add]  seq=$seq  $filename"

          # Replace empty placeholder on first entry
          if grep -q 'phase_1_files: \[\]' "$REGISTRY" 2>/dev/null; then
            sed -i 's/phase_1_files: \[\]/phase_1_files:/' "$REGISTRY"
          fi

          printf '\n  - sequence: %s\n    name: "%s"\n    checksum: "sha256:%s"\n    deployed_at: "%s"\n    commit_sha: "%s"\n    actor: "%s"\n    run_id: "%s"\n    status: "%s"\n' \
            "$seq" "$filename" "$checksum" "$DEPLOYED_AT" \
            "${{ github.sha }}" "${{ github.actor }}" "${{ github.run_id }}" "$STATUS" \
            >> "$REGISTRY"
        done

        echo ""
        echo "Registry:"
        cat "$REGISTRY"

    - name: Commit updated registry
      if: always()
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add supabase/phase_1_registry.yml
        if git diff --cached --quiet; then
          echo "No registry changes to commit."
          exit 0
        fi
        git commit -m "ci: update phase_1 registry [run ${{ github.run_number }}]"
        # Pull with rebase to handle any commits pushed since workflow started
        git pull --rebase origin master
        git push origin master

    # ── Summary ─────────────────────────────────────────────────────────
    - name: Deployment summary
      run: |
        echo "=== Deployment Complete ==="
        echo "Run ID      : ${{ github.run_id }}"
        echo "Run number  : ${{ github.run_number }}"
        echo "Commit SHA  : ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "Timestamp   : $(date -u)"
        echo ""
        echo "Current registry stack:"
        grep -E '^\s+(sequence|name|status):' supabase/phase_1_registry.yml | sed 's/^/  /'
        echo ""
        echo "SQL files in phase_1:"
        find supabase/phase_1 -name "*.sql" | sort | while read f; do
          echo "  - $f"
        done
