name: Deploy Phase 1 SQL Files

on:
  push:
    branches:
    - master
    paths:
    - 'supabase/phase_1/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    # ── Checksum snapshot before deployment ──────────────────────────
    - name: Generate phase_1 checksums
      run: |
        echo "=== Phase 1 SQL File Checksums ===" | tee phase_1_checksums.txt
        echo "Commit SHA  : ${{ github.sha }}"    | tee -a phase_1_checksums.txt
        echo "Branch      : ${{ github.ref_name }}" | tee -a phase_1_checksums.txt
        echo "Actor       : ${{ github.actor }}"  | tee -a phase_1_checksums.txt
        echo "Timestamp   : $(date -u)"            | tee -a phase_1_checksums.txt
        echo ""                                    | tee -a phase_1_checksums.txt
        echo "SHA256  FILE"                        | tee -a phase_1_checksums.txt
        echo "----------------------------------------------" | tee -a phase_1_checksums.txt
        find supabase/phase_1 -name "*.sql" | sort | while read f; do
          sha256sum "$f" | tee -a phase_1_checksums.txt
        done

    - name: Upload checksum artifact
      uses: actions/upload-artifact@v4
      with:
        name: phase_1-checksums-${{ github.sha }}
        path: phase_1_checksums.txt
        retention-days: 90

    # ── Supabase deployment via psql ──────────────────────────────────
    - name: Install PostgreSQL client
      run: sudo apt-get install -y postgresql-client

    - name: Run phase_1 SQL deployment
      id: db_push
      run: |
        REGISTRY="supabase/phase_1_registry.yml"
        echo "Applying phase_1 SQL files in sequence..."
        echo "(files already in registry will be skipped — immutability guard)"
        echo ""
        find supabase/phase_1 -name "*.sql" | sort | while read f; do
          filename=$(basename "$f")
          # Second line of defence: skip any file already recorded in registry
          if [ -f "$REGISTRY" ] && grep -q "name: \"${filename}\"" "$REGISTRY" 2>/dev/null; then
            echo "  [skip] $filename — already deployed (in registry)"
            continue
          fi
          echo "  --> Applying: $f"
          psql "${{ secrets.SUPABASE_DB_URL }}" -f "$f" -v ON_ERROR_STOP=1
          echo "  --> Done: $f"
        done
        echo ""
        echo "All phase_1 files processed."
      env:
        PGSSLMODE: require
        PGCONNECT_TIMEOUT: 30

    # ── Registry update ───────────────────────────────────────────────
    - name: Update phase_1 registry
      if: always()
      shell: bash
      run: |
        set -x  # print every command before executing — shows exact failure line

        REGISTRY="supabase/phase_1_registry.yml"
        PHASE_DIR="supabase/phase_1"
        DEPLOYED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

        echo "--- DEBUG: environment ---"
        echo "  bash version : $BASH_VERSION"
        echo "  pwd          : $(pwd)"
        echo "  REGISTRY     : $REGISTRY"
        echo "  PHASE_DIR    : $PHASE_DIR"
        echo "  db_push.outcome : ${{ steps.db_push.outcome }}"

        STATUS="applied"
        if [ "${{ steps.db_push.outcome }}" != "success" ]; then
          STATUS="failed"
        fi
        echo "  STATUS       : $STATUS"

        echo "--- DEBUG: registry file check ---"
        if [ -f "$REGISTRY" ]; then
          echo "  Registry exists. Contents:"
          cat "$REGISTRY"
        else
          echo "  Registry NOT found — creating it now"
          mkdir -p "$(dirname "$REGISTRY")"
          printf '# Phase 1 Registry\n# Auto-updated by GitHub Actions.\n\nphase_1_files: []\n' > "$REGISTRY"
          echo "  Created registry. Contents:"
          cat "$REGISTRY"
        fi

        echo "--- DEBUG: listing SQL files ---"
        find "$PHASE_DIR" -name "*.sql" | sort || echo "  (no files found)"

        echo "--- DEBUG: processing files ---"
        for filepath in $(find "$PHASE_DIR" -name "*.sql" | sort); do
          filename=$(basename "$filepath")
          echo "  Processing: $filename"

          echo "  Checking if already registered..."
          if grep -q "name: \"${filename}\"" "$REGISTRY"; then
            echo "  [skip] $filename — already registered"
            continue
          fi
          echo "  Not yet registered — will add"

          echo "  Counting existing entries..."
          existing=0
          existing=$(grep -c '^\s*- sequence:' "$REGISTRY") || existing=0
          existing=${existing:-0}
          echo "  existing count: $existing"
          seq=$((existing + 1))
          echo "  next sequence : $seq"

          echo "  Computing checksum..."
          checksum=$(sha256sum "$filepath" | awk '{print $1}')
          echo "  checksum: $checksum"

          if grep -q 'phase_1_files: \[\]' "$REGISTRY"; then
            echo "  Replacing empty placeholder..."
            sed -i 's/phase_1_files: \[\]/phase_1_files:/' "$REGISTRY"
          fi

          echo "  Appending entry to registry..."
          printf '\n  - sequence: %s\n    name: "%s"\n    checksum: "sha256:%s"\n    deployed_at: "%s"\n    commit_sha: "%s"\n    actor: "%s"\n    run_id: "%s"\n    status: "%s"\n' \
            "$seq" "$filename" "$checksum" "$DEPLOYED_AT" \
            "${{ github.sha }}" "${{ github.actor }}" "${{ github.run_id }}" "$STATUS" \
            >> "$REGISTRY"

          echo "  [add] seq=$seq $filename — done"
        done

        echo "--- DEBUG: final registry contents ---"
        cat "$REGISTRY"
        echo "--- DEBUG: registry update complete ---"

    # ── Commit registry ───────────────────────────────────────────────
    - name: Commit updated registry
      if: always()
      run: |
        echo "--- DEBUG: git status before add ---"
        git status

        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add supabase/phase_1_registry.yml

        echo "--- DEBUG: git diff after add ---"
        git diff --cached --stat

        if git diff --cached --quiet; then
          echo "No registry changes to commit."
          exit 0
        fi

        git commit -m "ci: update phase_1 registry [run ${{ github.run_number }}]"

        echo "--- DEBUG: fetching origin/master ---"
        git fetch origin master

        echo "--- DEBUG: rebasing onto origin/master ---"
        git rebase origin/master

        echo "--- DEBUG: pushing to origin/master ---"
        git push origin master
        echo "--- DEBUG: push complete ---"

    # ── Summary ───────────────────────────────────────────────────────
    - name: Deployment summary
      if: always()
      run: |
        echo "=== Deployment Complete ==="
        echo "Run ID      : ${{ github.run_id }}"
        echo "Run number  : ${{ github.run_number }}"
        echo "Commit SHA  : ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "Timestamp   : $(date -u)"
        echo ""
        echo "SQL files in phase_1:"
        find supabase/phase_1 -name "*.sql" | sort | while read f; do
          echo "  - $f"
        done
        echo ""
        echo "Registry:"
        cat supabase/phase_1_registry.yml || echo "(registry not found)"
